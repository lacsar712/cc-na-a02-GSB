{% extends "base.html" %}
{% block body %}
<h1>为新灯建卡</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form class="card" method="post">
  {% csrf_token %}
  <label>灯号</label>
  <input name="aid_code" value="{{ form.aid_code }}" required />
  <label>所在水道</label>
  <input name="waterway" value="{{ form.waterway }}" required />
  <label>标称坎德拉</label>
  <input name="nominal_cd" type="number" step="0.1" value="{{ form.nominal_cd }}" required />
  <button type="submit">建卡</button>
</form>
<p><a href="{% url 'cards' %}">返回台账</a></p>
{% endblock %}
